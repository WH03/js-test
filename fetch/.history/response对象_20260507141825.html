<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch发送基本的get请求</title>
</head>

<body>
    <script>
        /*
            接口地址：http://ajax-base-api-t.itheima.net/api/getbooks
            请求方式：GET，
            请求参数：可选
        */
        const url = 'http://ajax-base-api-t.itheima.net/api/getbooks';
        async function getData() {
            try {
                let res = await fetch(url);
                let json = await res.json();
                console.log(json)
                console.log('res.ok:', res.ok)
            } catch (err) {
                console.log(err)
            }
        }
        getData();
    </script>
</body>

</html>
