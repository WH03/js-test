<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封装fetch请求</title>
    <script src="./http.js"></script>
</head>

<body>
    <script>
        const url = 'https://ajax-base-api-t.itheima.net/api/getbooks'
        // 封装fetch请求

        // 测试代码1
        async function fn1() {
            let result = await http({
                url: url,
                method: 'get',
                params: {
                    id: 2
                }
            })
            console.log('result1:', result)
        }
        fn1()
        // 测试代码2
        async function fn2() {
            let result = await http({
                url: 'https://ajax-base-api-t.itheima.net/api/addbook',
                method: 'post',
                data: {
                    bookname: '测试书籍1',
                    author: '测试作者',
                    publisher: '测试出版社'
                }
            })
            console.log('result2:', result)
        }
        fn2()
    </script>
</body>

</html>
