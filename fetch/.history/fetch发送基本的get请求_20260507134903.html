<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch发送基本的get请求</title>
</head>

<body>
    <script>

        /*
            接口地址：http://ajax-base-api-t.itheima.net/api/getbooks
            请求方式：GET，
            请求参数：可选
        */
        fetch('http://ajax-base-api-t.itheima.net/api/getbooks').then(res => {
            return res.json()
        }).then(json => {
            // 获取经过res.json()处理过的json数据
            console.log(json)
        })
    </script>
</body>

</html>
