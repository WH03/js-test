<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封装fetch请求</title>
</head>

<body>
    <script>
        const url = 'https://ajax-base-api-t.itheima.net/api/getbooks'
        // 封装fetch请求
        async function http(obj) {
            let { url, method, params, data } = obj
            // 处理params参数，将其转换成查询字符串的形式：key：value，拼接到url后面
            if (params) {
                let str = new URLSearchParams(params).toString()
                url += `?${str}`
            }
            // console.log('url:', url)

            let res;// 定义一个变量来存储fetch的结果
            // 处理data参数，将其转换成json字符串的形式，放在fetch的body中
            if (data) {
                res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',// 设置请求头
                    },
                    body: JSON.stringify(data)// 将data对象转换成json字符串
                })
            } else {
                res = await fetch(url)
            }
            return res.json()// 将fetch的结果转换成json数据并返回
        }

        // 测试代码1
        async function fn1() {
            let result = await http({
                url: url,
                method: 'get',
                params: {
                    id: 2
                }
            })
            console.log('result1:', result)
        }
        fn1()
        // 测试代码2
        async function fn2() {
            let result = await http({
                url: url,
                method: 'post',
                data: {
                    bookname: '测试书籍',
                    author: '测试作者',
                    publisher: '测试出版社'
                }
            })
            console.log('result2:', result)
        }
        fn2()
    </script>
</body>

</html>
